name: Sync Satellites to Supabase

on:
  workflow_dispatch:   # still allows manual runs from the Actions tab
  schedule:
    # Every 6 hours (4x/day). CelesTrak's Active GP list only updates
    # every ~2 hours anyway, and their usage policy asks automated
    # tools to limit checks to about 3-4 times a day — don't go lower
    # than this without a real reason, to avoid getting rate-limited.
    #
    # Deliberately offset 13 minutes past the hour instead of on the
    # hour: huge numbers of automated tools worldwide are scheduled at
    # exactly :00, so CelesTrak sees a synchronized traffic spike right
    # at the top of every hour. Landing a few minutes off that avoids
    # the worst of it.
    - cron: '13 */6 * * *'

concurrency:
  group: sync-satellites
  cancel-in-progress: false   # queue instead of killing a run in progress

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install satellite.js @supabase/supabase-js ws

      - name: Run satellite sync
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/sync-satellites.js
