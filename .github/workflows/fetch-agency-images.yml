name: Fetch Agency HQ Images

# Manual only — this isn't a continuous sync like launches/satellites/weather,
# it's a one-off (or occasional) build-time image refresh. Trigger it from
# the "Actions" tab whenever you want to (re)run the image search.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Run agency image fetch script
        run: node scripts/fetch_agency_hq_images.js

      - name: Commit updated images and data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/agency-hq app/space-agencies/agencyData.js
          git diff --cached --quiet || git commit -m "Update agency HQ images (automated)"
          git push
